<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player - Pro</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: #121212;
    color: white;
    transition: background 0.8s ease;
    overflow-x: hidden;
  }

  /* Auth Screen */
  .auth-container {
    max-width: 450px;
    width: 100%;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 60px 40px;
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .google-signin-btn {
    background: white;
    color: #333;
    border: none;
    border-radius: 50px;
    padding: 16px 32px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
  }

  /* Main Container */
  .container {
    max-width: 1000px;
    width: 100%;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(30px);
    border-radius: 28px;
    padding: 40px;
    display: none; /* Shown via JS */
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .user-profile {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    background: rgba(255,255,255,0.05);
    padding: 15px;
    border-radius: 15px;
  }

  .user-avatar { width: 40px; height: 40px; border-radius: 50%; }

  .view-controls { display: flex; gap: 10px; margin-bottom: 30px; justify-content: center; }
  .view-btn {
    padding: 10px 20px;
    background: rgba(255,255,255,0.1);
    border: none;
    color: white;
    border-radius: 20px;
    cursor: pointer;
  }
  .view-btn.active { background: white; color: black; }

  /* Album Grid */
  .albums-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 20px;
  }

  .album-card {
    background: rgba(255,255,255,0.05);
    padding: 15px;
    border-radius: 15px;
    cursor: pointer;
    transition: transform 0.3s;
  }
  .album-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.1); }
  .album-card img { width: 100%; border-radius: 10px; margin-bottom: 10px; }

  /* Player Section */
  .player-section {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.1);
    text-align: center;
  }

  .progress-bar {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    margin: 15px 0;
    cursor: pointer;
    position: relative;
  }
  .progress-fill { height: 100%; background: #1db954; width: 0%; border-radius: 3px; }

  .player-controls { display: flex; justify-content: center; align-items: center; gap: 20px; }
  .play-pause { width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 24px; cursor: pointer; }
</style>
</head>
<body>

<div class="auth-container" id="authContainer">
  <h1>🎵 Music Player</h1>
  <p>Sign in to sync your library</p>
  <button class="google-signin-btn" onclick="signInWithGoogle()">Continue with Google</button>
</div>

<div class="container" id="mainContainer">
  <div class="user-profile">
    <div style="display:flex; align-items:center; gap:10px;">
        <img id="userAvatar" class="user-avatar" src="">
        <span id="userName"></span>
    </div>
    <button onclick="signOut()" style="background:none; border:1px solid red; color:red; padding:5px 10px; border-radius:10px; cursor:pointer;">Sign Out</button>
  </div>

  <div class="view-controls">
    <button class="view-btn active" onclick="setView('artists')">Library</button>
    <button class="view-btn" onclick="setView('liked')">❤️ Liked</button>
  </div>

  <div id="view"></div>

  <div class="player-section">
    <h3 id="nowPlayingTitle">Select a track</h3>
    <p id="nowPlayingArtist" style="opacity: 0.6;"></p>
    
    <div class="progress-bar" id="progressBar" onclick="seek(event)">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div style="display:flex; justify-content:space-between; font-size:12px; margin-top:-10px; margin-bottom:10px;">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
    </div>

    <div class="player-controls">
      <button onclick="prev()" style="background:none; color:white; border:none; font-size:24px; cursor:pointer;">⏮</button>
      <button class="play-pause" id="playBtn" onclick="playPause()">▶</button>
      <button onclick="next()" style="background:none; color:white; border:none; font-size:24px; cursor:pointer;">⏭</button>
    </div>
  </div>
</div>

<audio id="audio"></audio>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBBnoRAumsSjIRcAuMgZ9SbLvyBgrHveUA",
  authDomain: "music-player-5b729.firebaseapp.com",
  projectId: "music-player-5b729",
  storageBucket: "music-player-5b729.firebasestorage.app",
  messagingSenderId: "510281576115",
  appId: "1:510281576115:web:8f09b88c7337f5dac94ac6"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ====== LIBRARY DATA ======
const library = {
  artists: [
    {
      name: "Nirvana",
      albums: [
        {
          title: "Nevermind",
          cover: "https://upload.wikimedia.org/wikipedia/en/b/b7/NirvanaNevermindalbumcover.jpg",
          theme: "linear-gradient(135deg, #1e3a5f 0%, #121212 100%)",
          tracks: [
            {title: "Smells Like Teen Spirit", file: "audio/smells_like_teen_spirit.mp3"},
            {title: "In Bloom", file: "audio/in_bloom.mp3"},
            {title: "Come As You Are", file: "audio/come_as_you_are.mp3"}
          ]
        },
        {
          title: "In Utero",
          cover: "https://upload.wikimedia.org/wikipedia/en/e/e5/In_Utero_%28Nirvana%29_album_cover.jpg",
          theme: "linear-gradient(135deg, #e8dcc0 0%, #121212 100%)",
          tracks: [
            {title: "Serve The Servants", file: "audio/serve.m4a"},
            {title: "Heart Shaped Box", file: "audio/hear.m4a"}
          ]
        }
      ]
    }
  ]
};

let currentUser = null;
let currentTrackList = [];
let currentIndex = 0;
const audio = document.getElementById('audio');

// ====== AUTH ======
auth.onAuthStateChanged(user => {
  if (user) {
    currentUser = user;
    document.getElementById('authContainer').style.display = 'none';
    document.getElementById('mainContainer').style.display = 'block';
    document.getElementById('userName').textContent = user.displayName;
    document.getElementById('userAvatar').src = user.photoURL;
    showArtistsView();
  } else {
    document.getElementById('authContainer').style.display = 'block';
    document.getElementById('mainContainer').style.display = 'none';
  }
});

async function signInWithGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  await auth.signInWithPopup(provider);
}

function signOut() { auth.signOut(); }

// ====== NAVIGATION ======
function setView(view) {
  if(view === 'artists') showArtistsView();
  document.querySelectorAll('.view-btn').forEach(btn => btn.classList.toggle('active', btn.innerText.toLowerCase().includes(view)));
}

function showArtistsView() {
  const viewDiv = document.getElementById('view');
  let html = `<div class="albums-grid">`;
  library.artists.forEach((artist) => {
    artist.albums.forEach((album, albIdx) => {
      html += `
        <div class="album-card" onclick="playAlbum('${artist.name}', ${albIdx})">
          <img src="${album.cover}" onerror="this.src='https://via.placeholder.com/150'">
          <div style="font-weight:bold">${album.title}</div>
          <div style="font-size:12px; opacity:0.7">${artist.name}</div>
        </div>`;
    });
  });
  viewDiv.innerHTML = html + `</div>`;
}

// ====== PLAYER ======
function playAlbum(artistName, albIdx) {
  const artist = library.artists.find(a => a.name === artistName);
  const album = artist.albums[albIdx];
  currentTrackList = album.tracks;
  currentIndex = 0;
  
  document.body.style.background = album.theme || '#121212';
  playTrack(currentIndex);
}

function playTrack(index) {
  const track = currentTrackList[index];
  audio.src = track.file;
  document.getElementById('nowPlayingTitle').textContent = track.title;
  document.getElementById('nowPlayingArtist').textContent = library.artists[0].name;
  
  audio.play().catch(() => alert("File not found: " + track.file));
  document.getElementById('playBtn').textContent = '⏸';
}

function playPause() {
  if (audio.paused) {
    audio.play();
    document.getElementById('playBtn').textContent = '⏸';
  } else {
    audio.pause();
    document.getElementById('playBtn').textContent = '▶';
  }
}

function next() {
  currentIndex = (currentIndex + 1) % currentTrackList.length;
  playTrack(currentIndex);
}

function prev() {
  currentIndex = (currentIndex - 1 + currentTrackList.length) % currentTrackList.length;
  playTrack(currentIndex);
}

// ====== PROGRESS ======
audio.addEventListener('timeupdate', () => {
  const progress = (audio.currentTime / audio.duration) * 100;
  document.getElementById('progressFill').style.width = progress + '%';
  
  const m = Math.floor(audio.currentTime / 60);
  const s = Math.floor(audio.currentTime % 60);
  document.getElementById('currentTime').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
});

audio.addEventListener('loadedmetadata', () => {
  const m = Math.floor(audio.duration / 60);
  const s = Math.floor(audio.duration % 60);
  document.getElementById('duration').textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
});

function seek(e) {
  const rect = document.getElementById('progressBar').getBoundingClientRect();
  const pos = (e.clientX - rect.left) / rect.width;
  audio.currentTime = pos * audio.duration;
}
</script>
</body>
</html>
